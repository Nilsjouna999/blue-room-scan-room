<!doctype html>
<!-- THROWAWAY PROTOTYPE — BR-S406. Untracked scratch, same as _u1-harness.html.

     The builder liked L1's darker register and asked to SEE M1 and M2 in it. This
     loads the REAL site in a frame and injects a dark override, with a live A/B
     toggle — because the one lesson this project has already paid for (BR-S044, the
     M1 rank reversal) is: build the toggle before arguing for a redesign. Nothing
     here touches the live design. If the dark wins, the override block below is the
     thing that gets promoted into styles.css.

     Press 1 / 2 / 3 to jump to L1 / M1 / M2. Press D to flip dark on and off. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>M1 / M2 — dark register prototype</title>
  <style>
    html, body { margin: 0; height: 100%; background: #050506; color: #c8c4bb;
      font-family: "IBM Plex Mono", ui-monospace, monospace; }
    #bar {
      position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); bottom: 14px;
      display: flex; gap: 10px; align-items: center;
      padding: 7px 14px; border-radius: 999px;
      background: rgba(8, 9, 11, .9); border: 1px solid rgba(220,215,203,.14);
      backdrop-filter: blur(6px); font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
    }
    #bar button {
      background: none; border: 1px solid rgba(220,215,203,.16); border-radius: 999px;
      color: #b9b3a8; padding: 5px 11px; cursor: pointer;
      font: inherit; letter-spacing: .18em;
    }
    #bar button.on { color: #c9a35c; border-color: #c9a35c; }
    #bar .sep { color: rgba(220,215,203,.28); }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <iframe id="f" src="index.html?cb=darkproto"></iframe>
  <div id="bar">
    <span>Register</span>
    <button id="d" class="on">dense</button>
    <span class="sep">·</span>
    <button data-go="0">L1</button>
    <button data-go="1">M1</button>
    <button data-go="2">M2</button>
  </div>

  <script>
  /* THE OVERRIDE. Written in L1's own vocabulary and nothing else:
       · a radial near-black floor instead of the warm lifted one
       · saturation pulled down, so gold stops being the loudest thing in the room
       · every soft glow replaced by a hairline — a line drawing itself reads as made,
         a glow reads as applied (this is the same correction L1's hover just took)
       · panels sit on their own darker ground so the room has depth without light */
  /* BR-S406: the v1 "dimmed" register is DELETED. The builder: "it was bad" — and
     it was, for the reason recorded in DENSE below: it reached darkness by removing,
     and removal without replacement is thinness. Kept nothing of it. */

  /* BR-S406: ?dark=1 applies it on load, so the prototype can be screenshotted both
     ways without anyone pressing anything. */
  /* ★ V2 — DARK BY DENSITY, NOT BY DIMMING. The builder on v1: "flimsy page". Correct,
     and the cause is in v1's own rules — it reached darkness by REMOVING (saturation
     down, glows off, panels at .55 alpha). Semi-transparency IS thinness: a panel you
     can see through is a panel that is not there. And desaturating everything equally
     leaves nothing to look at, which is why it reads as a page rather than a room.
     L1 works because it is DENSE: a near-opaque ground, real blur, and ONE crisp
     object standing on it.
     So v2 gives back what v1 took, in a different currency:
       · panels get OPAQUE ground, not alpha — the floor is solid and things sit ON it
       · the field desaturates; the OBJECT does not. One bright thing in a dark room
         is contrast. Everything dim equally is fog.
       · weight comes from EDGES and an inset seat, so a card looks set into the page
         rather than floated over it
       · the grain stays. Texture is most of what makes dark feel like material
         instead of like an absence of light. */
  /* ── THE DENSE REGISTER ───────────────────────────────────────────────────────────
   All reasoning lives HERE, in JS, and the CSS below carries none. Three separate
   breakages in this file came from comments inside the template literal — backticks
   ending the string, and blocks that closed with a star-slash they never opened. A
   literal is not a stylesheet; it does not get to have prose in it.

   WHAT THE BUILDER ASKED FOR, and the rule each answer follows:
   · "the blue was nicer to read with, less things screaming"
     COOL DARKS RECEDE, WARM DARKS ADVANCE. A blue-black ground falls away from the
     eye so only what should be looked at comes forward; the warm ground of the
     earlier pass advanced, putting the floor in the foreground beside the text.
     That competition IS the screaming, and the original has the same fault.
   · "missing grounding, earthly colours to ground emotionally or rootly"
     Earth gathers at the BOTTOM and is gone by 46% — a horizon, not a tint — and
     raised surfaces are warm so they read as risen out of the floor.
   · "the card is still too bright"
     Damped to .90 and the radiance moved OFF the paper into a halo around it.

   ★ AND THE GROUND SELECTOR IS `body`. `.menu` and `#menuView` both compute to
   background: none — BODY paints this page. Every ground change before this one was
   a no-op, and the differences I reported were the tiles and the card alone. */
var DENSE = `
    body {
      background:
        linear-gradient(to top, rgba(30,26,21,.9) 0%, rgba(22,19,15,.46) 14%, rgba(16,14,11,.13) 30%, transparent 46%),
        radial-gradient(125% 78% at 50% -6%, #0f1620 0%, #0b1018 44%, #080b11 78%, #06080c 100%)
        !important;
    }
    .menu__panel { filter: saturate(.9); }
    .menu__panel--wall, .menu__panel--reliquary { background: none; }

    .menu__reliq-niche, .menu__codex, .menu__reliq-preview {
      background: linear-gradient(#151310, #100f0c) !important;
      border: 1px solid rgba(233,229,220,.11) !important;
      box-shadow: inset 0 1px 0 rgba(233,229,220,.045),
                  0 18px 40px -22px rgba(0,0,0,.9) !important;
      backdrop-filter: none !important;
    }

    .msample__card, .rv-cardframe {
      position: relative;
      filter: brightness(.9) saturate(.98);
      box-shadow: 0 32px 70px -34px rgba(0,0,0,.95),
                  0 0 90px -20px rgba(233,229,220,.14),
                  0 0 0 1px rgba(233,229,220,.07) !important;
    }
    .msample__card::after, .rv-cardframe::after {
      content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
      border-radius: inherit;
      backdrop-filter: contrast(.9) saturate(.95) brightness(.97);
      -webkit-backdrop-filter: contrast(.9) saturate(.95) brightness(.97);
      box-shadow: inset 0 1px 0 rgba(233,229,220,.12);
    }

    .menu__draw-title, .menu__reliq-title { text-shadow: none !important; }
    .menu__reliq-eyemark, .menu__codex__mark { opacity: .8; }
    .menu__reliq-door, .menu__go-btn {
      background: linear-gradient(#151310, #11100d) !important;
      border-color: rgba(233,229,220,.15) !important;
    }
`;

  /* Dense is ON by default: it is the candidate, and a prototype that opens on the
     thing you already have wastes the first look. ?v=0 opens on the original. */
  var f = document.getElementById("f"),
      on = !/[?&]v=0/.test(location.search);
  function doc() { try { return f.contentDocument; } catch (e) { return null; } }
  function apply() {
    var b = document.getElementById("d");
    b.textContent = on ? "dense" : "original";     // the label is always honest, even
    b.className = on ? "on" : "";                  // before the frame is ready
    var d = doc(); if (!d || !d.head) return false;
    var el = d.getElementById("__darkproto");
    if (el) el.remove();
    if (on) { el = d.createElement("style"); el.id = "__darkproto"; el.textContent = DENSE; d.head.appendChild(el); }
    return true;
  }
  document.getElementById("d").addEventListener("click", function () { on = !on; apply(); });
  /* BR-S406: the iframe can finish loading BEFORE this listener attaches, in which
     case `load` never fires for us and the override is never injected — which is
     exactly what happened on a headless capture that came back reading "original".
     Attach it AND poll briefly, so the prototype cannot silently show the wrong
     register. A prototype that lies about which version you are looking at is worse
     than no prototype. */
  f.addEventListener("load", apply);
  apply();
  /* BR-S406 — WHY THIS IS A KEEPER AND NOT A ONE-SHOT. Two failures got us here:
     a stale `!mode` in the guard (renamed to `on`, so `!undefined` cleared the poll on
     tick one), and — subtler — the FIRST document an iframe has is about:blank. Inject
     into that and the override is real for a few milliseconds, the guard sees success,
     the poll stops, and then the actual page loads clean while the label still says
     "dense". So the loop no longer stops on success. It just keeps the override
     present, which is the only condition that was ever wanted, and costs nothing on a
     prototype. */
  setInterval(function () {
    var d = doc();
    if (!d || !d.querySelector(".menu")) return;          // not the real document yet
    var has = !!d.getElementById("__darkproto");
    if (on !== has) apply();
  }, 250);

  // jump straight to a panel, using the app's own keyboard nav rather than its internals
  document.querySelectorAll("[data-go]").forEach(function (b) {
    b.addEventListener("click", function () {
      var d = doc(); if (!d) return;
      var want = +b.dataset.go;
      // step there one key at a time; the app clamps and the tug absorbs any overshoot
      for (var i = 0; i < 4; i++) d.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowLeft", bubbles: true }));
      for (var j = 0; j < want; j++) d.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));
    });
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "d" || e.key === "D") { on = !on; apply(); }
    if ("012".indexOf(e.key) >= 0) { var b = document.querySelector('[data-go="' + e.key + '"]'); if (b) b.click(); }
    if ("123".indexOf(e.key) >= 0 && e.key !== "0") {
      var b2 = document.querySelector('[data-go="' + (+e.key - 1) + '"]'); if (b2) b2.click();
    }
  });
  </script>
</body>
</html>
