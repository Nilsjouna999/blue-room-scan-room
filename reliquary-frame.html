<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reliquary — gutter-frame variant</title>

  <!-- ============================================================
       RELIQUARY / PROFILE — "gutter-frame" VARIANT (non-invasive)

       Mounts the REAL profile (arcana-profile.js/.css, unchanged) in the
       centre column, then grows a decorative botanical border in the two
       empty side gutters that only exist on a wide screen.

       Doctrine:
         - The art is a SEPARATE fixed layer, pointer-events:none, sitting
           only OUTSIDE the 620px content column. It can never intercept a
           click or shift the profile's layout. Delete #gutter-frame and the
           profile is exactly as it ships.
         - It speaks the profile's own language: near-black ground, muted
           antique-gold ink (#a2864a), warm gold light. The greenery is
           deep + desaturated so it FRAMES the archive, never a garden.
         - Two slow loops only (vine sway 17s, jar-glow breath 12s — synced
           to the crown's own pfBreath). Everything else is still.
         - Hidden below 1100px: the frame is a wide-screen luxury; on
           narrower screens content goes full-width, untouched.
  ============================================================= -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="arcana-profile.css?v=211" />

  <style>
    html, body { margin: 0; background: #070607; }

    /* the two gutter containers — fixed, only the margins outside the 620 column,
       above the profile (z 40 > .pf 30), but inert (pointer-events:none). */
    .gf { position: fixed; top: 0; bottom: 0; width: calc((100vw - 620px) / 2);
          z-index: 40; pointer-events: none; overflow: hidden; }
    .gf--left  { left: 0; }
    .gf--right { right: 0; transform: scaleX(-1); }   /* mirror the frame */
    .gf svg { width: 100%; height: 100%; display: block; }

    @keyframes gfSway  { 0%, 100% { transform: rotate(-0.6deg); } 50% { transform: rotate(0.6deg); } }
    @keyframes gfBreath{ 0%, 100% { opacity: .55; } 50% { opacity: .95; } }
    .gf-vine { transform-box: fill-box; transform-origin: bottom center; }
    @media (prefers-reduced-motion: no-preference) {
      .gf-vine { animation: gfSway 17s ease-in-out infinite; }
      .gf-glow { animation: gfBreath 12s ease-in-out infinite; }
    }

    /* the frame is a wide-screen luxury — below 1100px it steps aside entirely */
    @media (max-width: 1099px) { .gf { display: none; } }
  </style>
</head>
<body>
  <!-- the real profile mounts here -->
  <div id="host"></div>

  <!-- the botanical gutter frame (decorative only) -->
  <div class="gf gf--left"  id="gf-left"  aria-hidden="true"></div>
  <div class="gf gf--right" id="gf-right" aria-hidden="true"></div>

  <script src="arcana-profile.js?v=211"></script>
  <script>
    (function () {
      "use strict";

      // ---- the gutter art, authored once (drawn for the LEFT gutter; the
      //      right container mirrors it via scaleX(-1)). viewBox 240 x 1000,
      //      anchored bottom-outer so the vine roots at the floor and climbs. ----
      function leaf(x, y, rot, s) {
        return '<g transform="translate(' + x + ',' + y + ') rotate(' + rot + ') scale(' + s + ')">' +
          '<path d="M0 0 C7 -4 13 1 9 9 C4 13 -3 9 0 0 Z" fill="#3f5c46"/>' +
          '<path d="M0 0 C7 -4 13 1 9 9 C4 13 -3 9 0 0 Z" fill="none" stroke="#a2864a" stroke-width=".6" opacity=".5"/>' +
          '<path d="M1 1 L7 7" stroke="#5c7d5f" stroke-width=".5" opacity=".6"/></g>';
      }

      var VINE_D = "M34 994 C46 930 22 880 38 812 C52 752 26 700 40 632 " +
                   "C52 576 30 520 44 452 C54 398 34 344 46 276 C54 224 40 190 48 150";

      var svg =
        '<svg viewBox="0 0 240 1000" preserveAspectRatio="xMinYMax meet" xmlns="http://www.w3.org/2000/svg">' +
          '<defs>' +
            '<radialGradient id="gfWarm" cx="50%" cy="50%" r="50%">' +
              '<stop offset="0" stop-color="#c9a35c" stop-opacity="0.22"/>' +
              '<stop offset="0.6" stop-color="#c9a35c" stop-opacity="0.05"/>' +
              '<stop offset="1" stop-color="#c9a35c" stop-opacity="0"/></radialGradient>' +
          '</defs>' +

          // faint warm floor-pool, low and outer (echoes the crown's pool, kept subtle)
          '<ellipse cx="40" cy="982" rx="96" ry="74" fill="url(#gfWarm)" opacity=".7"/>' +

          // the climbing vine + its leaves (the one thing that sways)
          '<g class="gf-vine">' +
            '<path d="' + VINE_D + '" fill="none" stroke="#8a7038" stroke-width="3" stroke-linecap="round" opacity=".9"/>' +
            '<path d="' + VINE_D + '" fill="none" stroke="#c0a05d" stroke-width="1" stroke-linecap="round" opacity=".28"/>' +
            // a small tendril curl at the growing tip
            '<path d="M48 150 C40 142 40 132 49 131 C56 130 57 139 51 141" fill="none" stroke="#8a7038" stroke-width="2" stroke-linecap="round" opacity=".85"/>' +
            leaf(46, 858, 24, 1.15) + leaf(28, 760, -150, 1.0) + leaf(48, 662, 30, 1.2) +
            leaf(28, 562, -156, 1.0) + leaf(48, 462, 22, 1.12) + leaf(32, 360, -146, 0.95) +
            leaf(47, 268, 34, 1.05) +
            // a draping side-tendril reaching gently toward the page
            '<path d="M40 632 C64 636 84 632 96 640" fill="none" stroke="#8a7038" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>' +
            leaf(96, 640, 60, 0.9) +
          '</g>' +

          // a hairline specimen jar on a low ledge — a "kept" thing, warm-lit within
          '<line x1="12" y1="702" x2="100" y2="702" stroke="#a2864a" stroke-width="1" opacity=".4"/>' +
          '<circle class="gf-glow" cx="52" cy="678" r="40" fill="url(#gfWarm)"/>' +
          '<rect x="36" y="652" width="32" height="50" rx="9" fill="rgba(233,229,220,.02)" stroke="#a2864a" stroke-width="1" opacity=".82"/>' +
          '<path d="M37 682 h30 v18 a9 9 0 0 1 -9 9 h-12 a9 9 0 0 1 -9 -9 Z" fill="#c9a35c" opacity=".14"/>' +
          '<rect x="43" y="644" width="18" height="9" rx="2" fill="none" stroke="#a2864a" stroke-width="1" opacity=".7"/>' +
          // a green sprig kept in the jar
          leaf(48, 640, -10, 0.8) + leaf(58, 642, 40, 0.7) + leaf(52, 634, 14, 0.75) +

          // a low tuft at the vine's root
          '<g stroke="#3f5c46" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".8">' +
            '<path d="M24 992 L20 966"/><path d="M34 992 L34 960"/><path d="M44 992 L48 968"/><path d="M54 992 L60 972"/></g>' +

          // two gold motes drifting in the dark margin
          '<circle cx="72" cy="486" r="1.1" fill="#c0a05d" opacity=".3"/>' +
          '<circle cx="24" cy="322" r="1" fill="#c0a05d" opacity=".24"/>' +
        '</svg>';

      var left = document.getElementById("gf-left"), right = document.getElementById("gf-right");
      if (left) left.innerHTML = svg;
      if (right) right.innerHTML = svg;

      // mount the real profile
      var host = document.getElementById("host");
      if (window.BRArcanaProfile && typeof window.BRArcanaProfile.mount === "function") {
        window.BRArcanaProfile.mount(host);
      } else {
        host.innerHTML = '<p style="padding:48px;color:#948f87;text-align:center;font-family:sans-serif">' +
          'The profile failed to load (arcana-profile.js).</p>';
      }
    })();
  </script>
</body>
</html>
