  // ~94% of the time, then a short C1-continuous brake that drops it into place.
  function spinEase(p){
    if (p>=1) return 1;
    if (p<=0) return 0;
    var pA=FREE_END, fL=FREE_DIST, k=DROOP;
    if (p<=pA){ var u=p/pA; return fL*((1+k)*u - k*u*u); }        // constant-ish coast, slight droop
    var q=(p-pA)/(1-pA), q2=q*q, q3=q2*q;                          // cubic Hermite brake fL->1, C1 seam, f'(1)=0
    var s0=(fL*(1-k)/pA)*(1-pA);                                   // = coast exit slope, mapped to q-space
    return (2*q3-3*q2+1)*fL + (q3-2*q2+q)*s0 + (-2*q3+3*q2);
  }
  // tiny compass-needle settle in the final 10% — a single smooth hump, value AND slope = 0 at p=1 (no wobble)
  function spinDetent(p){
    if (DETENT_DEG<=0 || p<=0.9) return 0;
    var q=(p-0.9)/0.1, s=Math.sin(Math.PI*q);
    return DETENT_DEG*s*s;
  }

  var spinRAF = 0;
  // winner is resolved PURELY from the final rot value — never from the animation path.
  // The ORIGINAL resolveWinner math, verbatim (segDeg/nrm/idx), minus the render() — decide now, paint later.
  function resolveWinnerSilently(){
    var segs = segments(), n = segs.length;
    var isDefault = n===1 && !segs[0].text;   // empty state is now the 1-wedge obsidian orb (was the 4-color fan)
    var segDeg = 360/n;
    var nrm = (((-rot + segDeg/2)%360)+360)%360;
    var idx = Math.floor(nrm/segDeg)%n;
    state.spinning = false;
    state.result = isDefault ? null : segs[idx].text;
    state.winner = isDefault ? null : idx;
    return isDefault;
  }
  // idempotent — the single disclosure tick; wheel light-up + SOLID name print share ONE render() call ⇒ auto-synced.
  // Now fired at the arrow-SEAT (impact) frame (see armCeremony), not at the drip. Stays interrupt-safe via revealPending.
  function commitReveal(){
    if (!state.revealPending) return;
    state.revealPending = false;
    justRevealed = true;
    sig = null;                                // bust the cache — force the ONE winner repaint
    render();                                  // draw() winner-dim + gold rim + renderControls name+swatch, one tick
    justRevealed = false;                      // flag consumed synchronously by renderControls
  }
  function spin(){
    if (state.spinning) return;
    finalizeTransition();
    var arc = CEREMONY_AUTO_DECAY ? (spunSinceEdit===0 ? 'full' : 'lean') : 'full';   // FULL on first spin of a set, LEAN on repeats
    spunSinceEdit++;
    var reduce = prefersReduced();
    var turns = DRAW_TURNS[DRAW][0] + Math.floor(Math.random()*DRAW_TURNS[DRAW][1]);   // draw-length turns — the free, fast feel
    var start = rot;
    rot = rot + turns*360 + Math.random()*360;          // θ_final — the ONLY source of truth for the winner
    state.spinning = true; state.result = null; state.winner = null; render();

    if (reduce){                                        // short, no coast/detent
      canvas.style.transition='transform 0.6s cubic-bezier(0.2,0.8,0.2,1)';
      if (inkCanvas){ inkCanvas.style.transition=canvas.style.transition; }
      void canvas.offsetWidth;
      canvas.style.transform='rotate('+rot+'deg)'; mirrorInk('rotate('+rot+'deg)');
      var rmT=setTimeout(function(){ if(state.revealPending===false && state.result===null){ state.revealPending=true; resolveWinnerSilently(); commitReveal(); } }, 800);   // watchdog: a dropped transitionend must not strand on "Deciding…"
      canvas.addEventListener('transitionend', function(){ clearTimeout(rmT); state.revealPending=true; resolveWinnerSilently(); commitReveal(); }, {once:true});
      return;
    }

    canvas.style.transition='none';                     // rAF owns the transform
    canvas.style.willChange='transform';
    if (inkCanvas){ inkCanvas.style.transition='none'; inkCanvas.style.willChange='transform'; }
    var dist=rot-start, t0=performance.now();
    (function frame(now){
      var p=(now-t0)/DRAW_MS[DRAW]; if (p>1) p=1;
      canvas.style.transform='rotate('+(start + spinEase(p)*dist + spinDetent(p))+'deg)';
      mirrorInk(canvas.style.transform);                // ink layer rides the exact same per-frame angle
      if (p<1){ spinRAF=requestAnimationFrame(frame); }
      else { spinRAF=0; canvas.style.transform='rotate('+rot+'deg)';   // exact lock onto rot (unchanged)
             // the two willChange teardowns that used to sit HERE now run in endCeremony: clearing them
             // on the lock frame de-promoted two layers and then re-promoted them ~900ms later at the
             // seat — two layer churns on the two frames that can least afford them.
             mirrorInk('rotate('+rot+'deg)');
             state.revealPending = true;
             var isDefault = resolveWinnerSilently();                  // winner decided NOW, silently
             if (isDefault || prefersReduced() || !ceremonyOn){ commitReveal(); }   // empty orb / ceremony off: instant reveal, no theatre
             else { renderControls();                                  // result row blanks; wheel stays neutral
                    armCeremony(arc, commitReveal); } }                // theatre begins; reveals at the ARROW-SEAT (impact) frame
    })(performance.now());
  }

  // ======================================================================
  // ============  THE VERDICT CEREMONY  (100% additive, post-settle)  =====
  //   The wheel stops, the arrow laps and SEATS at the top — and on that seat
  //   (impact) frame commitReveal() lights the winner + prints the verdict SOLID.
  //   The milk-bead then births at the top rim, splits down both edges, and
  //   SPLATS onto the already-visible verdict as a finishing kiss (no reveal).
  //   Zero per-frame canvas work; all motion is WAAPI on pre-placed overlays.
  // ======================================================================

  // ---- tunables (spec §7 defaults) ----
  var CEREMONY_AUTO_DECAY = false;   // full ritual on EVERY spin (arc resolves to 'full'); on/off governed by the toggle, not decay
  // ---- ceremony on/off toggle (persisted) ----
  var CEREMONY_KEY='brWheelCeremony';
  var ceremonyOn=(function(){ try{ return localStorage.getItem(CEREMONY_KEY)!=='off'; }catch(e){ return true; } })();
  function setCeremonyOn(on){ ceremonyOn=on; try{ localStorage.setItem(CEREMONY_KEY,on?'on':'off'); }catch(e){} syncCeremonyToggle(); }
  function syncCeremonyToggle(){ var b=document.getElementById('ceremonyToggle'); if(!b) return;
    b.setAttribute('aria-checked', ceremonyOn?'true':'false');
    b.textContent = ceremonyOn ? 'Ceremony · On' : 'Ceremony · Off'; }
  var CEREMONY_MAX_FULL   = 2500;    // watchdog — force-fires endCeremony(true) if a callback is throttled/dropped
  var CEREMONY_MAX_LEAN   = 1200;
  // ---- THE LAP: g-force launch · linear cruise · kinetic-hammer stop ("G-LONG") ----
  //   T_A = 140ms launch · T_B = 712ms cruise · T_C = 48ms hammer.  ω = 0.4277286 deg/ms.
  //   θ_A = 41.298 · θ_B = 304.543 · θ_C = 14.159  ⇒  Σ = 360.000 exactly.
  //   Velocity is CONTINUOUS at both seams (|Δv| < 1e-7 deg/ms) and EXACTLY ZERO at both ends, so
  //   acceleration is discontinuous at precisely two instants — the yank and the strike — and
  //   nowhere else. The hammer crushes 4.5x more deceleration into its 48ms than the launch spends
  //   accelerating, which is what makes a zero-exit-velocity stop still read as a blow rather than
  //   a glide; the energy then leaves the arrow and enters the ORB (see orbAbsorb).
  //   Cruise is 7.129 deg/frame @60Hz — BETTER sampled than the old 820ms lap's 7.317.
  var LAP_MS         = 900;
  var SMEAR_DEG      = 26;           // arc-smear sweep; 18 / 26 / 34 are the sanctioned choices
  var ORBIT_DIR      = 1;            // 1 = clockwise
  var TICK_SPARK_MS  = 80;
  var TICK_RING_MS   = 120;
  var VITRIFY_MS     = 160;          // B4b glaze opacity pulse, peak 0.6
  // ---- impact-to-the-core (DIRECTIONAL CHAIN: strike → lens plunges the axis → core swallows inward → orb squashes/sinks, over-damped, no bounce) ----
  var IMPACT_SCALE_Y = 0.972;        // top flattens under the blow (anisotropic squash → circle to ellipse)
  var IMPACT_SCALE_X = 1.009;        // slight lateral bulge
  var IMPACT_SINK    = 5.0;          // px the whole orb dips under the strike
  var IMPACT_MS      = 260;          // orb squash-and-sink duration — do NOT walk this into the liquid window
  var PLUNGE_MS      = 170;          // the bright lens travelling 12 o'clock → core
  var CORE_DELAY     = 120;          // the core swallows inward as the lens lands
  var CORE_MS        = 200;          // core pinch-to-zero duration
  // PLUNGE_DIST is MEASURED from the live top-rim→hub gap in the wire-up block (do NOT hardcode px — breaks on mobile)

  // ---- element refs ----
  var wheelArea  = document.querySelector('.wheel-area');
  var ptr        = document.querySelector('.pointer');
  var orbitArm   = document.querySelector('.orbit-arm');
  var armSmear   = document.querySelector('.arm-smear');
  var ringBody   = document.querySelector('.ring-body');
  var liquidShell= document.querySelector('.ring-liquid-shell');
  var glassBand  = document.querySelector('.engrave-glass');
  var shadowEl   = document.querySelector('.disc-shadow');
  var fxLayer    = document.querySelector('.fx');
  var vitrifyEl  = document.querySelector('.vitrify');
  var sparkEl    = document.querySelector('.spark');
  var ringEl     = document.querySelector('.ring');
  var sparkEls   = [sparkEl, ringEl];
  var dropEl  = fxLayer ? fxLayer.querySelector('.drop')  : null;
  var splatEl = fxLayer ? fxLayer.querySelector('.splat') : null;
  var dropA   = fxLayer ? fxLayer.querySelector('.dropA') : null;
  var dropB   = fxLayer ? fxLayer.querySelector('.dropB') : null;
  var filmR    = fxLayer ? fxLayer.querySelector('.filmR')    : null;
  var channelR = fxLayer ? fxLayer.querySelector('.channelR') : null;
  var filmL    = fxLayer ? fxLayer.querySelector('.filmL')    : null;
  var channelL = fxLayer ? fxLayer.querySelector('.channelL') : null;
  var coreR    = fxLayer ? fxLayer.querySelector('.coreR')    : null;
  var coreL    = fxLayer ? fxLayer.querySelector('.coreL')    : null;
  var rills = [filmR, channelR, filmL, channelL, coreR, coreL];
  var coreEl  = document.querySelector('.coreflash');
  var plungeEl = document.querySelector('.plunge');

  // ============ THE STONE: a blue-black CORUNDUM, shield cut ============
  // Mohs 9, second-hardest natural mineral, SG 4.0 — the honest "weighs tons / hardest thing"
  // claim without pretending to be diamond. Its darkest grade reads BLACK and only confesses
  // blue in its speculars and in its depths, so the colour lives in the highlights and never in
  // the fill: restraint enforced by the material rather than by discipline. It contrasts the
  // obsidian orb by FINISH, not hue — obsidian is volcanic glass with a broad soft dome sheen;
  // corundum is crystalline, plane-broken, mirror-flat, hard-edged. Same darkness family,
  // different material class: a harder thing about to strike a softer thing. That IS the hammer
  // story, told in substance.
  //
  // THE INVERSION THAT SELLS IT: the TABLE is the DARKEST broad plane, not the brightest. Looking
  // down through a dark stone's table returns the black room. A bright table is what makes a drawn
  // gem look like a drawn logo; a dark one is what makes it look like a stone.
  //
  // Facet geometry, disc-space (same translated frame as the old triangle). The CULET is FROZEN at
  // (240,-14): DROP_TOP / the liquid's contact frame are authored against it. Top edge held at
  // y=-67 so the 760 canvas margin and header clearance are unchanged; the stone gains mass
  // laterally only (52→56 wide). Widest point sits 24.5% down = top-heavy = a hammer head.
  var ARROW_TIP_R = 254;    // culet radius from the disc centre — the liquid's source frame reads this
  var GEM = {
    SIL:   [[216,-67],[264,-67],[268,-54],[256,-35],[240,-14],[224,-35],[212,-54]],
    TAB:   [[222,-67],[258,-67],[252,-56],[228,-56]],
    CR_L:  [[216,-67],[222,-67],[228,-56],[212,-54]],
    CR_R:  [[258,-67],[264,-67],[268,-54],[252,-56]],
    PV_L:  [[212,-54],[228,-56],[240,-56],[240,-14],[224,-35]],
    PV_R:  [[240,-56],[252,-56],[268,-54],[256,-35],[240,-14]],
    FLASH: [[232.5,-30],[240,-38],[240,-22]],
    GIRD:  [[212,-54],[228,-56],[252,-56],[268,-54]],
    GHOST: [[212,-54],[224,-35],[240,-14],[256,-35],[268,-54]]
  };

  // rasterize the arrow ONCE to a PNG data-URI: a frozen bitmap on a permanently-promoted block layer
  function rasterizeArrow(){
    var S=760, OFF=(S-480)/2 /*=140*/;                      // canvas contract UNCHANGED — orbit maths depend on it
    var ss = (window.devicePixelRatio||1) >= 1.5 ? 3 : 2;   // the diagonal arrises want the oversample where it shows
    var c=document.createElement('canvas'); c.width=c.height=S*ss;
    var g=c.getContext('2d'); g.scale(ss,ss); g.translate(OFF,OFF);   // 480-space, centre still (240,240)
    g.lineJoin='miter'; g.miterLimit=8; g.lineCap='butt';   // HARD arrises. The old round join+cap inflated the
                                                            // shape ~4.5px a side and rounded every corner —
                                                            // roundness reads ductile, a preserved arris reads hard.
    var SIL=GEM.SIL, TAB=GEM.TAB, CR_L=GEM.CR_L, CR_R=GEM.CR_R,
        PV_L=GEM.PV_L, PV_R=GEM.PV_R, FLASH=GEM.FLASH, GIRD=GEM.GIRD, PGHOST=GEM.GHOST;
    function path(p,close,dx,dy){ dx=dx||0; dy=dy||0; g.beginPath(); g.moveTo(p[0][0]+dx,p[0][1]+dy);
      for(var i=1;i<p.length;i++) g.lineTo(p[i][0]+dx,p[i][1]+dy); if(close) g.closePath(); }
    function lin(x0,y0,x1,y1,st){ var q=g.createLinearGradient(x0,y0,x1,y1);
      for(var i=0;i<st.length;i++) q.addColorStop(st[i][0],st[i][1]); return q; }
    function rad(x,y,r,c0,c1){ var q=g.createRadialGradient(x,y,0,x,y,r); q.addColorStop(0,c0); q.addColorStop(1,c1); return q; }

    // (1) RIM SMUDGE — the pool of dark the hovering mass presses onto the glass below it
    g.save(); g.fillStyle=rad(240,-6,18,'rgba(0,0,0,0.46)','rgba(0,0,0,0)');
      g.beginPath(); g.ellipse(240,-6,18,6.5,0,0,Math.PI*2); g.fill(); g.restore();
    // (2) SIDE WALL (+3.0,+3.4) — real thickness. Filled twice to hang two shadow tiers off the UNION
    //     shape, both keyed to the world's upper-left light (the old shadow had offsetX 0 = a sticker).
    g.save(); g.fillStyle='#04070C';
      g.shadowColor='rgba(0,0,0,0.42)'; g.shadowBlur=16; g.shadowOffsetX=4; g.shadowOffsetY=11;
      path(SIL,true,3.0,3.4); g.fill();
      g.shadowColor='rgba(0,0,0,0.72)'; g.shadowBlur=4;  g.shadowOffsetX=2; g.shadowOffsetY=3;
      path(SIL,true,3.0,3.4); g.fill();
    g.restore();
    g.strokeStyle='rgba(126,154,192,0.18)'; g.lineWidth=1;          // the wall is polished too, not a blob
      path([SIL[1],SIL[2],SIL[3]],false,3.0,3.4); g.stroke();
    // (3) BODY UNDERPAINT — so no transparent hairline can survive between facets
    path(SIL,true); g.fillStyle=lin(206,-70,274,-16,[[0,'#1B2B44'],[0.42,'#101B2D'],[1,'#070B12']]); g.fill();
    // (4) PAVILIONS — shadow side first
    path(PV_R,true); g.fillStyle=lin(250,-56,244,-16,[[0,'#0D1626'],[1,'#05080E']]); g.fill();
    path(PV_L,true); g.fillStyle=lin(213,-52,240,-28,[[0,'#16233A'],[0.62,'#213450'],[1,'#2C4568']]); g.fill();
    // (5) TABLE — the DARK window, + one sky reflection in its upper-left corner
    path(TAB,true); g.fillStyle=lin(224,-67,252,-56,[[0,'#111C2E'],[0.5,'#0B1220'],[1,'#070C15']]); g.fill();
    g.save(); path(TAB,true); g.clip(); g.globalCompositeOperation='screen';
      g.fillStyle=rad(230,-64,8.5,'rgba(168,198,236,0.16)','rgba(168,198,236,0)');
      g.fillRect(210,-70,60,20); g.restore();
    // (6) CROWN BEVELS — CR_L is the ONE bright broad plane in the object
    path(CR_L,true); g.fillStyle=lin(214,-66,228,-55,[[0,'#7099CE'],[0.45,'#3B5A8A'],[1,'#20334D']]); g.fill();
    path(CR_R,true); g.fillStyle=lin(256,-66,268,-54,[[0,'#243A57'],[1,'#101A2B']]); g.fill();
    // (7) SUB-SURFACE — in a real cut stone you see the BACK facets through the front, MISREGISTERED
    //     because they are on the other side of the body. That offset is what separates "a shape with
    //     facet lines on it" from "a volume you are looking into".
    g.save(); path(SIL,true); g.clip();
      g.lineWidth=1.1; g.strokeStyle='rgba(122,168,224,0.15)'; path(PGHOST,false, 2.6,-3.2); g.stroke();
      g.beginPath(); g.moveTo(242.6,-58.7); g.lineTo(242.6,-17.7); g.stroke();            // ghost keel
      g.strokeStyle='rgba(4,7,12,0.55)';   path(PGHOST,false,-1.9, 2.4); g.stroke();      // the ghost's own shadow
      g.globalCompositeOperation='screen';
      g.fillStyle=rad(236,-34,20,'rgba(46,80,124,0.42)','rgba(46,80,124,0)'); g.fillRect(206,-70,68,60);
    g.restore();
    // (8) THE ONE INTERNAL GLINT — gems flash sparsely; two refractions in the whole stone, not five
    path(FLASH,true); g.fillStyle='rgba(168,198,236,0.52)'; g.fill();
    g.strokeStyle='rgba(220,233,248,0.62)'; g.lineWidth=0.8;
      g.beginPath(); g.moveTo(232.5,-30); g.lineTo(240,-38); g.stroke();
    // (9) GIRDLE — the frosted band + its under-shade: the instant "this is a CUT stone" signal
    g.strokeStyle='rgba(206,216,226,0.30)'; g.lineWidth=1.2; path(GIRD,false); g.stroke();
    g.strokeStyle='rgba(4,7,12,0.55)';      g.lineWidth=1.0; path(GIRD,false,0,1.3); g.stroke();
    // (10) KEEL — the brightest line in the stone, and its one cold glint
    g.strokeStyle='rgba(220,233,248,0.60)'; g.lineWidth=1.3;
      g.beginPath(); g.moveTo(240,-55.5); g.lineTo(240,-14.5); g.stroke();
    g.strokeStyle='rgba(220,233,248,0.75)'; g.lineWidth=0.6;
      g.beginPath(); g.moveTo(240,-55.5); g.lineTo(240,-33); g.stroke();
    // (11) COLD SEPARATION HAIRLINE — the sky catching the polished edge; keeps a near-black stone
    //      legible against a near-black room WITHOUT a warm or dark outline. Runs BEFORE the arrises
    //      so they paint over it and the occluded lower-left contour stays truly black.
    //      THIS IS THE VISIBILITY KNOB: 0.18 → 0.26 if the stone reads as a hole. Never a glow.
    g.lineWidth=2.4; g.strokeStyle='rgba(150,190,242,0.18)'; path(SIL,true); g.stroke();
    // (12) ARRISES — key side hard, off-key side cold-weak, occluded side black. A polished arris is
    //      a mirror LINE, not a glow: no blur, ever. (The old rgba(32,15,6,0.8) "definition edge" is
    //      deliberately not reproduced — against this room a dark outline only feathers warm and
    //      thins the shape. A gem on a dark ground is defined by its BRIGHT edge.)
    g.lineWidth=1.5; g.strokeStyle='rgba(220,233,248,0.85)'; path([SIL[6],SIL[0],SIL[1]],false); g.stroke();
    g.lineWidth=1.1; g.strokeStyle='rgba(168,198,236,0.34)'; path([SIL[1],SIL[2]],false); g.stroke();
    g.lineWidth=1.0; g.strokeStyle='rgba(126,154,192,0.26)'; path([SIL[2],SIL[3],SIL[4]],false); g.stroke();
    g.lineWidth=1.3; g.strokeStyle='rgba(4,7,12,0.90)';      path([SIL[4],SIL[5],SIL[6]],false); g.stroke();
    // (13) CULET — the sharpest point gets the sharpest light, and it is where the liquid is born
    g.fillStyle=rad(240,-14.6,3,'rgba(220,233,248,0.35)','rgba(220,233,248,0)');
      g.beginPath(); g.arc(240,-14.6,3,0,Math.PI*2); g.fill();
    g.fillStyle='#FFFFFF'; g.beginPath(); g.arc(240,-14.6,1.4,0,Math.PI*2); g.fill();   // ONE white point on the stone
    return c.toDataURL('image/png');
  }

  // ---- THE ARC SMEAR bake: N ghosts of the stone's ARRIS NETWORK ONLY, swept BEHIND a clockwise
  //      orbit. Lines, not fills, and no white tip glint — a trail, not a second arrow. Quadratic
  //      alpha falloff so the head stays the object and the tail is only persistence. ss=2: the
  //      trail peaks at 0.55 for well under a second and sub-pixel softness there is invisible. ----
  function rasterizeArrowSmear(){
    var S=760, OFF=(S-480)/2, ss=2, N=16;
    var c=document.createElement('canvas'); c.width=c.height=S*ss;
    var g=c.getContext('2d'); g.scale(ss,ss); g.translate(OFF,OFF);
    g.lineJoin='miter'; g.miterLimit=8; g.lineCap='butt';
    var SIL=GEM.SIL, GIRD=GEM.GIRD;
    function path(p,close){ g.beginPath(); g.moveTo(p[0][0],p[0][1]);
      for(var i=1;i<p.length;i++) g.lineTo(p[i][0],p[i][1]); if(close) g.closePath(); }
    for (var i=1;i<=N;i++){
      var a=-(SMEAR_DEG*i/N)*Math.PI/180, f=1-(i-1)/N, al=0.30*f*f;
      g.save(); g.translate(240,240); g.rotate(a); g.translate(-240,-240);
      g.strokeStyle='rgba(220,233,248,'+al.toFixed(4)+')'; g.lineWidth=1.4; path(SIL,true); g.stroke();
      g.strokeStyle='rgba(220,233,248,'+(al*0.7).toFixed(4)+')'; g.lineWidth=1.0; path(GIRD,false); g.stroke();
      g.strokeStyle='rgba(220,233,248,'+(al*0.85).toFixed(4)+')'; g.lineWidth=1.2;
      g.beginPath(); g.moveTo(240,-55.5); g.lineTo(240,-14.5); g.stroke();
      g.restore();
    }
    return c.toDataURL('image/png');
  }

  // ---- the controller (single owner of all beats + all teardown) ----
  var ceremony = { active:false, raf:0, timers:[], anims:[], watchdog:0 };
  var lapAnim = null;   // the live orbit animation — held so a tap-skip can FINISH it instead of cancelling it
  function ct(fn, delay){ ceremony.timers.push(setTimeout(fn, delay)); }   // registered timer
  function reg(a){ ceremony.anims.push(a); return a; }                     // registered WAAPI anim
  function showFx(el){ if (el) el.style.opacity='1'; }
  function hideFx(el){ if (el) el.style.opacity='0'; }
  function resetFx(){
    [dropEl, dropA, dropB, splatEl, coreEl, plungeEl].forEach(function(el){ if (el) el.style.opacity='0'; });
    if (dropEl) dropEl.style.transform='';
    if (dropA)  dropA.style.transform='';
    if (dropB)  dropB.style.transform='';
    if (coreEl)  coreEl.style.transform='translate(-50%,-50%)';
    rills.forEach(function(el){ if (el) el.style.strokeDashoffset='1'; });   // re-arm the rivulet strokes undrawn
  }

  function armCeremony(arc, onDone){          // arc = 'full' | 'lean'
    var lean = (arc==='lean');
    ceremony.active = true;
    ceremony.timers = [];
    ceremony.anims  = [];
    ceremony.watchdog = setTimeout(function(){ endCeremony(true); }, lean ? CEREMONY_MAX_LEAN : CEREMONY_MAX_FULL);
    document.addEventListener('visibilitychange', ceremonyVis);
    wheelArea.addEventListener('click', ceremonySkip);

    // promote the static wrappers now — the full branch gets ~900ms of lead, the lean branch a task
    // boundary. They carry no will-change at rest, so this costs nothing until a spin is under way.
    if (ringBody)    ringBody.style.willChange='transform';
    if (liquidShell) liquidShell.style.willChange='transform';
    if (glassBand)   glassBand.style.willChange='transform';

    resetFx();
    if (fxLayer) fxLayer.classList.add('live');

    if (lean){                                // repeat spins: no orbit lap; arrow already at top → reveal + beads fire immediately
      ct(function(){ tickFlash(); impactToCore(); vitrify(); if(onDone) onDone(); },  0);   // IMPACT: winner lights + verdict prints SOLID
      ct(beadBirth,                                            120);   // twin beads born from the arrow at the top rim
      ct(function(){ beadStream(true); },                      210);   // split → down both edges → merge at bottom
      ct(function(){ dripImpact(true); },                      730);   // 210 + FALL_LEAN(520): the drip KISSES the already-shown verdict
      ct(function(){ endCeremony(true); },                    1050);   // normal end = reveal BACKSTOP (idempotent; no-op once impact revealed)
    } else {                                  // first spin of a set: steady LINEAR lap; the SEAT (impact) reveals
      arrowLap(function(){ tickFlash(); impactToCore(); vitrify(); if(onDone) onDone(); }); // SEAT=IMPACT: winner lights + verdict prints SOLID
      ct(beadBirth,                                            940);   // ~40ms after the 900ms lap: beads deposited by the just-landed arrow
      ct(function(){ beadStream(false); },                    1030);   // split → down both edges → merge at bottom
      ct(function(){ dripImpact(false); },                    1710);   // 1030 + FALL_FULL(680): the drip lands on the verdict
      ct(function(){ endCeremony(true); },                    2040);   // normal end = reveal BACKSTOP (idempotent; no-op once impact revealed)
    }
  }

  function endCeremony(reveal){               // IDEMPOTENT — the SINGLE teardown
    if (!ceremony.active) return;
    ceremony.active = false;
    if (ceremony.raf){ cancelAnimationFrame(ceremony.raf); ceremony.raf = 0; }
    ceremony.timers.forEach(clearTimeout); ceremony.timers.length = 0;
    // THE LAP IS FINISHED, NOT CANCELLED. Cancelling it mid-orbit reverts the arm to its pre-animation
    // inline transform and the arrow TELEPORTS home from wherever it was; finishing jumps it to
    // rotate(360deg), which is visually identical to the rest angle, so a tap-skip lands instead of
    // snapping. (ceremony.active is already false above, so the finished-handler's reveal cannot fire.)
    if (lapAnim){ try{ lapAnim.finish(); }catch(e){} }
    ceremony.anims.forEach(function(a){ if (a!==lapAnim){ try{ a.cancel(); }catch(e){} } });
    ceremony.anims.length = 0; lapAnim = null;
    clearTimeout(ceremony.watchdog);
    document.removeEventListener('visibilitychange', ceremonyVis);
    wheelArea.removeEventListener('click', ceremonySkip);
    // hard-reset every decorative overlay to rest:
    if (orbitArm){ orbitArm.style.transform='rotate(0deg)'; }   // arrow stays VISIBLE (it is the pointer); revert inner to the rest angle
    if (armSmear){ armSmear.style.opacity='0'; }
    if (ringBody){    ringBody.style.transform='';    ringBody.style.willChange=''; }
    if (liquidShell){ liquidShell.style.transform=''; liquidShell.style.willChange=''; }
    if (glassBand){   glassBand.style.transform='';   glassBand.style.willChange=''; }
    if (shadowEl)   shadowEl.style.transform='';
    if (plateLayer) plateLayer.style.transform='';   // syncPlates rewrites it on the mirrorInk below
    canvas.style.willChange='';                      // moved OFF the spin's lock frame — see spin()
    if (ptr){ ptr.style.transform=''; ptr.style.willChange=''; ptr.style.opacity=''; ptr.style.transition=''; }
    if (fxLayer)   fxLayer.classList.remove('live');   // display:none hides the drop + splat
    if (vitrifyEl) vitrifyEl.style.opacity='0';
    if (coreEl)    coreEl.style.opacity='0';
    if (plungeEl)  plungeEl.style.opacity='0';
    // defensively zero every bead so an interrupt mid-stream leaves nothing stranded (fx is also display:none)
    [dropEl, dropA, dropB, splatEl].forEach(function(el){ if (el) el.style.opacity='0'; });
    rills.forEach(function(el){ if (el){ el.style.strokeDashoffset='1'; } });   // re-arm rivulet strokes undrawn for the next spin
    canvas.style.transform = 'rotate('+rot+'deg)';     // byte-identical to the lock — nothing drifts
    if (inkCanvas){ inkCanvas.style.transition='none'; inkCanvas.style.willChange=''; } mirrorInk('rotate('+rot+'deg)');
    if (reveal) commitReveal(); else state.revealPending = false;
  }
  function abortCeremony(){ endCeremony(false); }
  function ceremonyVis(){ if (document.hidden) endCeremony(true); }
  function ceremonySkip(){ endCeremony(true); }

  // ---- THE LAP: G-FORCE LAUNCH → LINEAR CRUISE → KINETIC-HAMMER STOP ----
  // The magnetic breathe lives on the OUTER (.orbit-hover) and never rotates, so this rotate() never
  // shares a transform with it. Three welded segments, C1-continuous at every joint (see the constants
  // block for the derivation): the arrow is TORN out of rest, sweeps one clean lap, and is stopped dead
  // in ~3 frames. It arrives at exactly zero velocity — the impact is sold by the crushed deceleration
  // and by the ORB taking the energy, never by a hard cut, which is what reads as teleport.
  function arrowLap(onImpact){
    if (!orbitArm){ if (onImpact) onImpact(); return; }
    orbitArm.style.transform = 'rotate(0deg)';
    lapAnim = reg(orbitArm.animate([
      { transform:'rotate(0deg)',       offset:0.000000, easing:'cubic-bezier(.32,0,.60,.42)' },  // v(0)=0 EXACT
      { transform:'rotate(41.298deg)',  offset:0.155556, easing:'linear'                      },  // launch → cruise, |Δv|<1e-7
      { transform:'rotate(345.841deg)', offset:0.946667, easing:'cubic-bezier(.40,.58,.68,1)' },  // the 48ms hammer
      { transform:'rotate(360deg)',     offset:1.000000 }
    ], { duration: LAP_MS, easing:'linear', fill:'forwards' }));
    smearRun();                                      // same task ⇒ same startTime; no sync surface at all
    lapAnim.finished.then(function(){
      if (ceremony.active && onImpact) onImpact();   // fires at the SEATED frame (v=0), still at t=LAP_MS
    }).catch(function(){});
  }
  // The trail dies at t≈880 — 20ms before the seat — so the last frames are the naked stone slamming home.
  function smearRun(){
    if (!armSmear) return;
    reg(armSmear.animate([
      {opacity:0,offset:0.0000},{opacity:0.10,offset:0.0400},{opacity:0.55,offset:0.1556},
      {opacity:0.55,offset:0.9200},{opacity:0.22,offset:0.9600},{opacity:0,offset:0.9778},{opacity:0,offset:1.0}
    ], {duration:LAP_MS, easing:'linear'}));         // fill defaults to 'none' ⇒ reverts to the CSS rest 0
  }

  // ---- B3b tick flash (light, not motion) ----
  function tickFlash(){
    if (sparkEl) reg(sparkEl.animate(
      [{opacity:0,transform:'translate(-50%,-50%) scale(.6)'},
       {opacity:1,transform:'translate(-50%,-50%) scale(.9)',offset:0.2},
       {opacity:0,transform:'translate(-50%,-50%) scale(1.1)'}],
      {duration:TICK_SPARK_MS, easing:'ease-out'}));
    if (ringEl) reg(ringEl.animate(
      [{opacity:.9,transform:'translate(-50%,-50%) scale(.4)'},
       {opacity:0, transform:'translate(-50%,-50%) scale(1.3)'}],
      {duration:TICK_RING_MS, easing:'ease-out'}));
  }

  // ---- IMPACT-TO-THE-CORE: a legible DIRECTIONAL CHAIN — orb squashes/sinks under the strike, a bright lens
  //      PLUNGES down the 12→centre axis, and the core swallows it INWARD (sequenced: strike → travel → absorb) ----
  function impactToCore(){ orbAbsorb(); plunge(); ct(coreFlash, CORE_DELAY); }

  // ORB SQUASH-AND-SINK on #wheel: anisotropic compression (circle→ellipse) + a small downward dip, then
  // over-damped e^-decay home — a felt, COLD, contained blow with NO rebound.
  // scale/translateY are PREPENDED (left of rotate(rot)) so the locked rotation stays byte-identical.
  function orbAbsorb(){
    // cFrac 0.075 = a 19.5ms compression, barely over one frame: a STRIKE, not a squeeze.
    // e^-5.2 is dead by ~200ms. Monotone decay, no rebound term anywhere — a cold contained blow.
    var N=14, kf=[], kfR=[], kfShadow=[], cFrac=0.075, OPT={duration:IMPACT_MS, easing:'linear'};
    for(var i=0;i<=N;i++){ var u=i/N, sx, sy, dy;
      if(u<=cFrac){ var w=u/cFrac; sy=1-(1-IMPACT_SCALE_Y)*w; sx=1+(IMPACT_SCALE_X-1)*w; dy=IMPACT_SINK*w; }
      else{ var v=(u-cFrac)/(1-cFrac), e=Math.exp(-5.2*v); sy=1-(1-IMPACT_SCALE_Y)*e; sx=1+(IMPACT_SCALE_X-1)*e; dy=IMPACT_SINK*e; }
      var body='translateY('+dy.toFixed(2)+'px) scale('+sx.toFixed(4)+','+sy.toFixed(4)+')';
      kf.push({transform: body+' rotate('+rot+'deg)'});     // the wheel carries its locked rotation
      kfR.push({transform: body});                          // the ring/glass/film never did
      kfShadow.push({transform:'translateY('+(dy*0.45).toFixed(2)+'px) scale('+(1+0.010*(dy/IMPACT_SINK)).toFixed(4)+')'});
    }
    kf[N]       = {transform:'translateY(0px) scale(1,1) rotate('+rot+'deg)'};
    kfR[N]      = {transform:'translateY(0px) scale(1,1)'};
    kfShadow[N] = {transform:'translateY(0px) scale(1)'};
    var a = reg(canvas.animate(kf, OPT));                                    // fill:none → reverts to inline rotate(rot)
    a.onfinish = function(){ canvas.style.transform='rotate('+rot+'deg)'; };
    if (inkCanvas){                                                          // the over-ring seams squash in lockstep
      var ai = reg(inkCanvas.animate(kf, OPT));
      ai.onfinish = function(){ mirrorInk('rotate('+rot+'deg)'); };
    }
    // EVERYTHING THE ORB IS MADE OF RIDES THE SAME FRAME. If any one of these stays rigid it visibly
    // detaches at the exact climax — which is the moment the whole ceremony is built around.
    if (ringBody)  reg(ringBody.animate(kfR, OPT));                          // astrolabe + liquid, as one body
    if (glassBand) reg(glassBand.animate(kfR, OPT));                         // the glass channel over them
    if (fxLayer)   reg(fxLayer.animate(kfR, OPT));                           // the white film clings to the sinking glass
    if (shadowEl)  reg(shadowEl.animate(kfShadow, OPT));                     // the cast shadow compresses toward it
    if (plateLayer){                                                         // the names squash with the wheel they name
      var pre='translate(-50%,-50%) scale('+plateK+') ', post=' rotate('+(plates.length===1?0:rot)+'deg)';
      reg(plateLayer.animate(kfR.map(function(k){ return {transform: pre+k.transform+post}; }), OPT));
    }
    ringSlosh();
  }

  // THE LIQUID LAGS THE BLOW. Only the WRAPPER moves, so .ring-liquid's own drift is never suspended.
  // A single damped sine starting at exactly ZERO: the nonzero initial VELOCITY is the impulse — the
  // container stops and the liquid keeps going, which is the physically right story and lands on the
  // liquid rather than on the arrow. Peak −6.2px at 44.5ms, naturally lagging the orb's 19.5ms
  // compression; residual at 560ms is 0.055px and the last keyframe pins it to exact rest.
  var SL_MS=560, SL_DIP=6.2, SL_ROT=1.35, SL_HZ=4.6, SL_Z=0.28;
  function ringSlosh(){
    if (!liquidShell) return;
    var w=2*Math.PI*SL_HZ/1000,                 // 0.0289027 rad/ms
        lam=w*SL_Z/Math.sqrt(1-SL_Z*SL_Z),      // 0.0084295 /ms
        A=SL_DIP/0.6597, Ar=SL_ROT/0.6597, N=18, kf=[];
    for (var i=0;i<=N;i++){ var t=i/N*SL_MS, e=Math.exp(-lam*t)*Math.sin(w*t);
      kf.push({transform:'translateY('+(A*e).toFixed(2)+'px) rotate('+(Ar*e).toFixed(3)+'deg)'}); }
    kf[N]={transform:'translateY(0px) rotate(0deg)'};
    var a=reg(liquidShell.animate(kf,{duration:SL_MS, easing:'linear'}));
    a.onfinish=function(){ liquidShell.style.transform=''; };   // if it sloshes the wrong way, negate SL_ROT
  }

  // THE PLUNGE LENS: flares just inside the top rim (the strike), accelerates DOWN the 12→centre axis,
  // narrows to a thread and vanishes exactly at the hub = the core swallowing the energy inward.
  function plunge(){
    if(!plungeEl) return;
    reg(plungeEl.animate([
      {transform:'translate(-50%,-50%) translateY(0px) scale(1,1)',                        opacity:0.0, offset:0.00, easing:'cubic-bezier(.2,.7,.4,1)'},
      {transform:'translate(-50%,-50%) translateY('+(PLUNGE_DIST*0.083)+'px) scale(1,1)',  opacity:0.95, offset:0.14},
      {transform:'translate(-50%,-50%) translateY('+PLUNGE_DIST+'px) scale(0.34,0.5)',     opacity:0.0, offset:1.00, easing:'cubic-bezier(.4,0,.7,.5)'}
    ],{duration:PLUNGE_MS, easing:'linear'}));
  }

  // CORE FLASH: the hub swallowing the plunge INWARD — blooms then pinches to scale 0 (energy eaten, not radiated).
  function coreFlash(){
    if(!coreEl) return;
    reg(coreEl.animate([
      {opacity:0,    transform:'translate(-50%,-50%) scale(0.45)'},
      {opacity:0.95, transform:'translate(-50%,-50%) scale(1.02)', offset:0.32},
      {opacity:0,    transform:'translate(-50%,-50%) scale(0.0)'}
    ],{duration:CORE_MS, easing:'cubic-bezier(.3,.7,.3,1)'}));
  }

  // ---- B4b vitrify (opacity-only glaze pulse; filter animation banned) ----
  function vitrify(){
    if (!vitrifyEl) return;
    reg(vitrifyEl.animate([{opacity:0},{opacity:0.6,offset:0.5},{opacity:0}], {duration:VITRIFY_MS, easing:'ease'}));
  }

  // ---- the white verdict bead: born at the arrow-landing (top), falls the full instrument, drips + paints ----
  var DROP_TOP   = [280, 64];    // born on TOP of the ball (top rim), right under the landed arrow tip (r254 → tip at y≈50)
  var DROP_MEET  = [280, 540];   // twins meet at the bottom of the glass (4px inside the 544 rim)
  var DROP_LAND  = [280, 684];   // kisses the #result row (UNCHANGED)
  var FALL_FULL  = 680;          // full surface journey (arc+pool+drip) — total unchanged ⇒ beat timers hold
  var FALL_LEAN  = 520;          // lean total — unchanged
  var BEAD_SWELL_MS = 90;        // birth pop at the top

  function beadBirth(){          // twin beads form co-located on the top rim — reads as ONE drop the arrow deposited
    if (!dropA||!dropB) return;
    dropA.style.opacity='1'; dropB.style.opacity='1';
    var kf=[{transform:'translate(280px,64px) scale(.3)',opacity:0},
            {transform:'translate(280px,64px) scale(1)', opacity:1}];
    var o={duration:BEAD_SWELL_MS, easing:'cubic-bezier(.2,.7,.2,1)', fill:'forwards'};
    reg(dropA.animate(kf,o)); reg(dropB.animate(kf,o));   // fully overlapped birth
  }
  // TWO-STREAM descent: split from the top, run down the left/right circumference, meet + pool at the bottom, hand off to the merged drip.
  function beadStream(lean){
    if (!dropA||!dropB||!dropEl) return;
    var TOTAL   = lean?FALL_LEAN:FALL_FULL;   // 520 | 680
    var DRIP    = lean?115:150;               // drip-off portion
    var ARCPOOL = TOTAL - DRIP;               // 405 | 530  (arc + short pool)
    // RIGHT arc (dropA): equal 18° steps on R=236 about (280,304); last keyframe = pool (flatten in place). Time front-loaded (gravity).
    reg(dropA.animate([
      {transform:'translate(280px,64px)  scale(1,1)',        offset:0.000, easing:'linear'},
      {transform:'translate(353px,80px)  scale(0.997,1.005)',offset:0.016},
      {transform:'translate(419px,113px) scale(0.989,1.018)',offset:0.053},
      {transform:'translate(471px,165px) scale(0.978,1.037)',offset:0.108},
      {transform:'translate(504px,231px) scale(0.964,1.060)',offset:0.178},
      {transform:'translate(516px,304px) scale(0.947,1.089)',offset:0.263},   // equator right (r=236)
      {transform:'translate(504px,377px) scale(0.926,1.123)',offset:0.363},
      {transform:'translate(471px,443px) scale(0.904,1.161)',offset:0.475},
      {transform:'translate(419px,495px) scale(0.878,1.203)',offset:0.600},
      {transform:'translate(353px,529px) scale(0.850,1.250)',offset:0.738},
      {transform:'translate(280px,540px) scale(0.82,1.30)',  offset:0.887},   // bottom meet — head thinned+stretched (accelerating water)
      {transform:'translate(280px,540px) scale(1.3,0.7)',    offset:1.000}    // POOL: beads coincide + flatten
    ],{duration:ARCPOOL, easing:'linear', fill:'forwards'}));
    // LEFT arc (dropB): x-mirror (560 − x), identical y + offsets
    reg(dropB.animate([
      {transform:'translate(280px,64px)  scale(1,1)',        offset:0.000, easing:'linear'},
      {transform:'translate(207px,80px)  scale(0.997,1.005)',offset:0.016},
      {transform:'translate(141px,113px) scale(0.989,1.018)',offset:0.053},
      {transform:'translate(89px,165px)  scale(0.978,1.037)',offset:0.108},
      {transform:'translate(56px,231px)  scale(0.964,1.060)',offset:0.178},
      {transform:'translate(44px,304px)  scale(0.947,1.089)',offset:0.263},   // equator left
      {transform:'translate(56px,377px)  scale(0.926,1.123)',offset:0.363},
      {transform:'translate(89px,443px)  scale(0.904,1.161)',offset:0.475},
      {transform:'translate(141px,495px) scale(0.878,1.203)',offset:0.600},
      {transform:'translate(207px,529px) scale(0.850,1.250)',offset:0.738},
      {transform:'translate(280px,540px) scale(0.82,1.30)',  offset:0.887},
      {transform:'translate(280px,540px) scale(1.3,0.7)',    offset:1.000}
    ],{duration:ARCPOOL, easing:'linear', fill:'forwards'}));
    // draw the rivulet head-first, glued to the bead's own keyframe offsets (do = 1 - arcFraction)
    var rillKf = [
      {strokeDashoffset:1, offset:0.000},{strokeDashoffset:0.90, offset:0.016},
      {strokeDashoffset:0.80, offset:0.053},{strokeDashoffset:0.70, offset:0.108},
      {strokeDashoffset:0.60, offset:0.178},{strokeDashoffset:0.50, offset:0.263},
      {strokeDashoffset:0.40, offset:0.363},{strokeDashoffset:0.30, offset:0.475},
      {strokeDashoffset:0.20, offset:0.600},{strokeDashoffset:0.10, offset:0.738},
      {strokeDashoffset:0,    offset:0.887},{strokeDashoffset:0,    offset:1.000}
    ];
    rills.forEach(function(el){ if (el) reg(el.animate(rillKf, {duration:ARCPOOL, easing:'linear', fill:'forwards'})); });
    // MEET+MERGE handoff — REGISTERED timer (cancel-safe via ceremony.timers). Same-frame coincident-white swap.
    ct(function(){
      hideFx(dropA); hideFx(dropB);
      showFx(dropEl);                                   // .drop appears exactly where the pool sat (280,540)
      reg(dropEl.animate([
        {transform:'translate(280px,540px) scale(1.25,0.72)', offset:0.00, easing:'cubic-bezier(.4,0,.7,.35)'},
        {transform:'translate(280px,566px) scale(0.82,1.28)', offset:0.30, easing:'cubic-bezier(.5,0,.85,.4)'},  // necks → hanging teardrop detaches
        {transform:'translate(280px,684px) scale(0.9,1.24)',  offset:1.00}                                       // DRIPS onto the text
      ],{duration:DRIP, easing:'linear', fill:'forwards'}));
    }, ARCPOOL);
  }
  function dripImpact(lean){   // the drip KISSES the already-visible white verdict — a finishing splat/ripple, NO reveal
    hideFx(dropEl);
    showFx(splatEl);
    // ripple blooms ON the word (origin 280,684 = where the thread lands) then fades — a finishing flourish, not a creator
    reg(splatEl.animate([
      {opacity:0, transform:'scale(0.5)'},
      {opacity:1, transform:'scale(0.92)', offset:0.22},
      {opacity:1, transform:'scale(1.0)',  offset:0.45},
      {opacity:0, transform:'scale(1.28)'}
    ], {duration:300, easing:'ease-out', fill:'forwards'}));
  }

  function addOption(){
    var t = (state.draft||'').trim();
    if (!t || state.spinning || state.options.length>=MAX) return;
    finalizeTransition();                                   // collapse any in-flight transition first (also aborts any ceremony)
    spunSinceEdit = 0;                                      // option-set changed → next spin is a FULL arc
    var isFirst = state.options.length===0;
    var col = (isFirst && state.preview) ? state.preview : paletteColor(state.options.length);   // slot-by-add-order
    var oldSegs = segments().slice();                       // snapshot BEFORE the push
    state.options.push({ text:t.slice(0,24), color:col.color, hue:col.hue });
    state.draft=''; state.preview=null; state.result=null; state.winner=null;
    document.getElementById('draft').value='';
    if (prefersReduced()){ sig=null; render(); return; }    // snap — no pop, no rAF
    renderControls();                                       // list/buttons update now; the canvas is owned by rAF
    var newSeg = { color: col.color, text: t.slice(0,24) };
    anim = { kind: isFirst?'first':'add', start: performance.now(),
             dur: isFirst?DUR_FIRST:DUR_POP, oldSegs: (isFirst?[]:oldSegs),
             newSeg: newSeg };
    if (plateLayer) plateLayer.style.opacity='0';   // names sit out the re-partition (parity: drawTransition never painted text)
    drawTransition(anim, 0);   // paint the first chunk SYNCHRONOUSLY on the click tick — no one-rAF deferral
    kick();
    draftEl.focus();           // parity with Enter-to-add: keep focus in the field for the next choice
  }

  function removeOption(i){
    if (state.spinning) return;
    finalizeTransition();
    spunSinceEdit = 0;                                      // option-set changed → next spin is a FULL arc
    var oldSegs = segments().slice();                       // the n real wedges, BEFORE splice
    var oldN = oldSegs.length;
    state.options.splice(i,1); state.result=null; state.winner=null;
    // snap: reduced-motion, or the last real option leaving (1 real -> the obsidian orb, an unrelated state)
    if (prefersReduced() || state.options.length===0 || oldN<=1){ sig=null; render(); return; }
    renderControls();
    anim = { kind:'remove', start: performance.now(), dur: DUR_REMOVE,
             oldSegs: oldSegs, removed:i };
    if (plateLayer) plateLayer.style.opacity='0';   // restored by syncPlateVerdict on the next canonical resting frame
    kick();
  }

  function reset(){
    if (state.spinning) return;
    finalizeTransition();
    rot = 0; canvas.style.transition='none'; canvas.style.transform='rotate(0deg)';
    if (inkCanvas){ inkCanvas.style.transition='none'; } mirrorInk('rotate(0deg)');
    spunSinceEdit = 0;                                       // option-set cleared → next spin is a FULL arc
    state.options=[]; state.draft=''; state.preview=null; state.result=null; state.winner=null; state.revealPending=false;
    document.getElementById('draft').value='';
    render();
  }

  // ---- view sync ----  (draw() is suppressed while a transition owns the canvas)
  function renderControls(){
    var r = document.getElementById('result');
    if (state.spinning)            r.innerHTML = '';        // status carried by the disabled button; the verdict slot stays withheld
    else if (state.revealPending)  r.innerHTML = '';       // verdict withheld — the drop delivers it
    else if (state.result){
      var wc = (state.winner!=null && state.options[state.winner]) ? state.options[state.winner].color : null;
      r.innerHTML = '<span class="k">Verdict</span><span class="rsw"></span><span class="v"></span>';
      if (wc) r.querySelector('.rsw').style.background = wc;
      var v = r.querySelector('.v');
      v.textContent = state.result;                        // solid #FFFFFF + glow, printed the instant the arrow seats (no paint-up)
    } else if (state.options.length < 2) r.innerHTML = '<span class="spin">Add two or more options</span>';
    else r.innerHTML = '';
    document.getElementById('count').textContent = state.options.length + '/' + MAX;
    var atMax = state.options.length>=MAX;
    var draftOk = !!(state.draft||'').trim();
    document.getElementById('add').disabled = state.spinning || atMax || !draftOk;
    document.getElementById('spin').disabled = state.spinning || state.options.length < 2;   // a decider needs ≥2 choices
    document.getElementById('spin').textContent = state.spinning ? 'Deciding…' : 'Spin';
    document.getElementById('reset').disabled = state.spinning || (!state.options.length && !draftOk && !state.result);
    var wrap = document.getElementById('optsWrap'), list = document.getElementById('opts');
    wrap.hidden = state.options.length===0;
    document.getElementById('optsHead').textContent = 'Options · ' + state.options.length;
    list.innerHTML = '';
    state.options.forEach(function(o,i){
      var row=document.createElement('div'); row.className='opt';
      var x=document.createElement('button'); x.className='x'; x.title='Remove'; x.textContent='×'; x.setAttribute('aria-label','Remove '+o.text);
      x.addEventListener('click', function(){ removeOption(i); });
      var sw=document.createElement('span'); sw.className='sw'; sw.style.background=o.color;
      var tx=document.createElement('span'); tx.className='tx'; tx.textContent=o.text;
      row.appendChild(x); row.appendChild(sw); row.appendChild(tx); list.appendChild(row);
    });
  }
  function render(){ if(!anim) draw(); renderControls(); }   // never paint over an in-flight transition

  // ---- events ---- (unchanged)
  var draftEl = document.getElementById('draft');
  draftEl.addEventListener('input', function(e){
    state.draft = e.target.value;
    if (state.options.length===0){
      if (state.draft.trim() && !state.preview) state.preview = paletteColor(state.options.length);
      if (!state.draft.trim()) state.preview = null;
    }
    state.result=null; state.winner=null;
    sig=null; render();
  });
  draftEl.addEventListener('keydown', function(e){ if (e.key==='Enter'){ e.preventDefault(); addOption(); } });
  document.getElementById('add').addEventListener('click', addOption);
  document.getElementById('spin').addEventListener('click', spin);
  document.getElementById('reset').addEventListener('click', reset);
  var ceremonyToggle=document.getElementById('ceremonyToggle');
  if (ceremonyToggle) ceremonyToggle.addEventListener('click', function(){
    setCeremonyOn(!ceremonyOn);
    if (!ceremonyOn && ceremony.active) endCeremony(true);   // collapse an in-flight ritual straight to the verdict
  });
  syncCeremonyToggle();   // reflect persisted state onto the toggle at load

  var _ringEl = document.querySelector('.engrave-ring');
  if (_ringEl){
    var _ringURI = bakeEngraveRing();
    _ringEl.style.backgroundImage = 'url('+_ringURI+')';
    var _ri = new Image(); _ri.src = _ringURI; if (_ri.decode) _ri.decode().catch(function(){});  // GPU-ready, no first-frame flash
  }
  var _liqEl = document.querySelector('.ring-liquid');
  if (_liqEl){
    var _lU = bakeRingLiquid();
    _liqEl.style.backgroundImage = 'url('+_lU+')';
    var _li = new Image(); _li.src = _lU; if (_li.decode) _li.decode().catch(function(){});   // GPU-ready, no first-frame flash
  }
  // measure the top-rim→hub gap ONCE (responsive; scales with the disc) so the plunge lens lands on the hub at any width
  var PLUNGE_DIST = (plungeEl && coreEl)
    ? (coreEl.getBoundingClientRect().top + coreEl.getBoundingClientRect().height/2)
      - (plungeEl.getBoundingClientRect().top + plungeEl.getBoundingClientRect().height/2)
    : 240;   // fallback for the authored 480 disc
  // ---- nameplate ring wire-up: one fixed 480 coordinate system scaled to the live disc ----
  plateLayer = document.getElementById('nameplates');
  var _dw = document.querySelector('.disc-wrap');
  function measurePlates(){
    // measure .disc-wrap, NEVER #wheel — the wheel is WAAPI-scaled during orbAbsorb
    var w = _dw ? _dw.getBoundingClientRect().width : DISC_S, k = (w||DISC_S)/DISC_S;
    if (Math.abs(k-plateK) < 0.002) return;
    plateK = k; psig = null; buildPlates();
  }
  measurePlates();
  if (window.ResizeObserver && _dw) new ResizeObserver(measurePlates).observe(_dw);
  else window.addEventListener('resize', measurePlates);
  // measureText returns fallback metrics until Inter lands — one-shot refit
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ psig=null; buildPlates(); }).catch(function(){});

  if (orbitArm){
    var _arrowURI = rasterizeArrow();
    orbitArm.style.backgroundImage = 'url('+_arrowURI+')';
    var _im=new Image(); _im.src=_arrowURI; if(_im.decode) _im.decode().catch(function(){}); // GPU-ready, kills first-frame flash
  }
  if (armSmear){
    var _smearURI = rasterizeArrowSmear();
    armSmear.style.backgroundImage = 'url('+_smearURI+')';
    var _si=new Image(); _si.src=_smearURI; if(_si.decode) _si.decode().catch(function(){});  // warmed like the gem
  }
  render();
})();
</script>
</body>
