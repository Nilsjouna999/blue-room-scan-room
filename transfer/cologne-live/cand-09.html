<!--
  THE ACCORD — candidate 09. Emphasis: LAYERING.
  Built strictly in physical layer order: recess floor/walls -> warm floor pool ->
  bottle glass (cap, neck, shoulder, body, base) -> liquid -> label -> glass edge
  highlights -> cap band / neck collar -> pane gleam (topmost, the glass covering
  the opening). Every element below appears in the DOM in that same order, so the
  paint order and the z-order agree with each other by construction, no z-index
  needed anywhere.

  LABEL CONTRAST — computed WCAG relative-luminance ratios for ink #2a2118 against
  the label stock as it actually renders (a top-to-bottom gradient, so both stops
  are checked):
    ink #2a2118  vs  cream top stop  #d8cdb4  ->  L_ink=0.01647, L_bg=0.61572
        ratio = (0.61572+0.05) / (0.01647+0.05) = 10.02 : 1
    ink #2a2118  vs  cream bottom stop #c9bda0 ->  L_ink=0.01647, L_bg=0.51338
        ratio = (0.51338+0.05) / (0.01647+0.05) = 8.48 : 1
  Both clear 4.5:1 with margin; the darker end of the gradient is the binding case
  and it still clears by a factor of ~1.9.
-->
<style>
  .accord-09-stage {
    box-sizing: border-box;
    width: 100%;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0908;
    padding: 4vh 2vw;
  }
  .accord-09-stage * { box-sizing: border-box; }

  /* ============ LAYER 1 — the recess: floor and walls ============ */
  .accord-09-recess {
    position: relative;
    width: min(46vw, 480px);
    aspect-ratio: 462 / 572;           /* 0.808 w/h — reference §2 */
    background:
      radial-gradient(ellipse 95% 70% at 50% 18%, #141210 0%, #100f0d 40%, #0d0c0b 68%, #0a0908 88%),
      radial-gradient(ellipse 70% 55% at 8% 100%, #080807 0%, transparent 60%),
      radial-gradient(ellipse 70% 55% at 92% 100%, #080807 0%, transparent 60%);
    border-radius: 0;                  /* square corners — reference §2 */
    overflow: hidden;
  }

  /* ============ LAYER 2 — warm floor pool under the base ============ */
  .accord-09-pool {
    position: absolute;
    left: 50%;
    top: 89%;
    width: 88%;
    height: 13%;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(150, 112, 62, 0.12) 0%, rgba(120, 90, 50, 0.05) 55%, transparent 80%);
    pointer-events: none;
  }

  /* ============ the bottle group — positioned by the reference's own ratios ============ */
  .accord-09-bottle {
    position: absolute;
    left: 19.15%;
    width: 61.7%;                      /* body width : recess width = 0.617 — §3 */
    top: 4.3%;
    height: 85.7%;                     /* total height : recess height = 0.857 — §3 */
  }

  /* ---- LAYER 3a — cap ---- */
  .accord-09-cap {
    position: absolute;
    left: 36.85%;
    width: 26.3%;                      /* cap width : body width = 0.263 — §3 */
    top: 0;
    height: 11.2%;                     /* cap : total height = 0.112 — §3 */
    background: linear-gradient(to bottom, #191919 0%, #141414 55%, #101010 100%);
    clip-path: polygon(6% 0%, 94% 0%, 100% 100%, 0% 100%); /* very slight taper */
  }
  .accord-09-cap-band {
    position: absolute;
    left: -2%;
    right: -2%;
    bottom: 0;
    height: 14%;
    background: linear-gradient(to bottom, #96754a 0%, #8a6a3a 50%, #6f5228 100%);
  }

  /* ---- LAYER 3b — neck (glass) ---- */
  .accord-09-neck {
    position: absolute;
    left: 38%;
    width: 24%;                        /* narrower than the cap */
    top: 11.2%;
    height: 4.5%;                      /* neck : total height = 0.045 — §3 */
    background: linear-gradient(to bottom, #17150f 0%, #14120d 100%);
  }
  .accord-09-neck-collar {
    position: absolute;
    left: -6%;
    right: -6%;
    bottom: 0;
    height: 20%;
    background: linear-gradient(to bottom, #b08f52 0%, #9a7a45 55%, #7a5f33 100%);
  }

  /* ---- LAYER 3c — shoulder (glass, decanter slope) ---- */
  .accord-09-shoulder {
    position: absolute;
    left: 0;
    width: 100%;
    top: 15.7%;                        /* cap + neck */
    height: 7.5%;                      /* shoulder : total height = 0.075 — §3 */
    background: linear-gradient(to bottom, #16140f 0%, #131109 100%);
    clip-path: polygon(38% 0%, 62% 0%, 100% 100%, 0% 100%);
  }

  /* ---- LAYER 3d — body (glass wall; liquid painted onto it next) ---- */
  .accord-09-body {
    position: absolute;
    left: 0;
    width: 100%;
    top: 23.2%;                        /* cap + neck + shoulder */
    height: 72%;                       /* body : total height = 0.72 — §3 */
    border-radius: 3%;                 /* small radius — §3 */
    overflow: hidden;
  }

  /* ============ LAYER 4 — the liquid ============ */
  .accord-09-liquid {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom,
      #6b6535 0%,
      #5f5c32 28%,
      #4a4926 58%,
      #3f3d20 78%,
      #2e2c18 100%);
  }

  /* ---- LAYER 3e — base (darker glass, catches the floor pool) ---- */
  .accord-09-base {
    position: absolute;
    left: -1%;
    width: 102%;
    top: 95.2%;                        /* cap + neck + shoulder + body */
    height: 4.8%;                      /* base : total height ≈ 0.048 — §3 */
    border-radius: 0 0 6% 6%;
    background: linear-gradient(to bottom, #2b2916 0%, #221f10 60%, #1c1a0d 100%);
  }

  /* ============ LAYER 5 — the label (the only bright plane) ============ */
  .accord-09-label {
    position: absolute;
    left: 16.65%;
    width: 66.7%;                      /* label width : body width = 0.667 — §4 */
    top: 41%;                          /* label spans 0.41 -> 0.98 of total height — §4 */
    height: 57%;
    background: linear-gradient(to bottom, #d8cdb4 0%, #d3c7ac 55%, #c9bda0 100%);
    box-shadow: inset 0 0 5px rgba(20, 16, 10, 0.10);
    color: #2a2118;
    padding: 6% 7% 5%;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(6.4px, 0.95vw, 10.5px);
    line-height: 1.25;
    text-align: center;
  }
  .accord-09-label-mono {
    font-family: "Courier New", Courier, monospace;
  }
  .accord-09-eyebrow {
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-size: 0.78em;
    letter-spacing: 0.12em;
    opacity: 0.82;
  }
  .accord-09-rule {
    width: 100%;
    height: 1px;
    background: #2a2118;
    opacity: 0.35;
    margin: 0.55em 0;
    flex: none;
  }
  .accord-09-product {
    font-size: 0.98em;
    letter-spacing: 0.18em;
    font-variant: small-caps;
    font-weight: bold;
  }
  .accord-09-subtitle {
    font-size: 0.72em;
    letter-spacing: 0.08em;
    opacity: 0.75;
    margin-top: 0.35em;
  }
  .accord-09-diamond {
    font-size: 0.68em;
    margin: 0.6em 0;
    opacity: 0.7;
  }
  .accord-09-name {
    font-size: 2.15em;
    font-family: Georgia, "Times New Roman", serif;
    font-style: normal;
    letter-spacing: 0.01em;
    margin: 0.05em 0 0.35em;
  }
  .accord-09-marks {
    font-size: 0.86em;
    letter-spacing: 0.1em;
    line-height: 2.1;
    opacity: 0.88;
    margin-bottom: 0.3em;
  }
  .accord-09-footer-line {
    font-size: 0.72em;
    letter-spacing: 0.14em;
    opacity: 0.8;
    margin-top: 0.2em;
  }
  .accord-09-footer-split {
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-size: 0.62em;
    letter-spacing: 0.08em;
    opacity: 0.65;
    margin-top: 0.35em;
  }

  /* ============ LAYER 6 — glass edge highlights (asymmetric) ============ */
  .accord-09-edge-left {
    position: absolute;
    left: 1.5%;
    top: 24%;
    width: 3.4%;
    height: 68%;
    background: linear-gradient(to right, rgba(255, 255, 255, 0.38), rgba(255, 255, 255, 0.06) 70%, transparent);
    border-radius: 3px;
  }
  .accord-09-edge-right {
    position: absolute;
    right: 2%;
    top: 38%;
    width: 2%;
    height: 34%;
    background: linear-gradient(to left, rgba(255, 255, 255, 0.14), transparent 80%);
    border-radius: 3px;
  }

  /* ============ LAYER 7 — pane gleam, topmost: the glass over the opening ============ */
  .accord-09-gleam {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 4% 4%, rgba(255, 255, 255, 0.085) 0%, rgba(255, 255, 255, 0.035) 22%, transparent 45%);
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .accord-09-stage * { transition: none !important; animation: none !important; }
  }
</style>

<div class="accord-09-stage">
  <div class="accord-09-recess">
    <!-- layer 2: floor pool -->
    <div class="accord-09-pool"></div>

    <!-- layer 3-6: the bottle, built strictly bottom-of-glass-stack upward -->
    <div class="accord-09-bottle">
      <div class="accord-09-cap">
        <div class="accord-09-cap-band"></div>
      </div>
      <div class="accord-09-neck">
        <div class="accord-09-neck-collar"></div>
      </div>
      <div class="accord-09-shoulder"></div>
      <div class="accord-09-body">
        <div class="accord-09-liquid"></div>
      </div>
      <div class="accord-09-base"></div>

      <!-- layer 5: the label, glued to the glass over body+base -->
      <div class="accord-09-label">
        <div class="accord-09-eyebrow accord-09-label-mono">
          <span>BLUE ROOM ACCORDS</span><span>FORMULA 01</span>
        </div>
        <div class="accord-09-rule"></div>
        <div class="accord-09-product accord-09-label-mono">THE BIRTH READING</div>
        <div class="accord-09-subtitle accord-09-label-mono">A PERSONAL ACCORD IN SIX NOTES</div>
        <div class="accord-09-diamond">&#9670;</div>
        <div class="accord-09-name">The Crowned Name</div>
        <div class="accord-09-marks accord-09-label-mono">
          SUN SIGN<br>YEAR ANIMAL<br>LIFE PATH<br>RUNE<br>TRIGRAM<br>HEXAGRAM
        </div>
        <div class="accord-09-rule"></div>
        <div class="accord-09-footer-line accord-09-label-mono">BY BIRTH ALONE</div>
        <div class="accord-09-footer-split accord-09-label-mono">
          <span>SIX MARKS</span><span>ONE ACCORD</span>
        </div>
      </div>

      <!-- layer 6: glass edge highlights, asymmetric -->
      <div class="accord-09-edge-left"></div>
      <div class="accord-09-edge-right"></div>
    </div>

    <!-- layer 7: the pane over the opening -->
    <div class="accord-09-gleam"></div>
  </div>
</div>
