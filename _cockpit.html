<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE COCKPIT — dev · preview · live, side by side</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
  THE COCKPIT.

  The builder: "the dev pane, where it shows dev, preview and live — the page
  actually turns to those, but i want rather the screen is cockpit that shows
  what dev, preview and live are, not actually turning in to them."

  ★ THE PILL IS A SWITCH, AND A SWITCH CANNOT ANSWER A COMPARISON. #brBuildFlip
  (app.js:1230) navigates: you leave the build you were in to look at another, so
  you are always comparing a page against your MEMORY of a page. That is fine for
  "take me there" and useless for "what is different". Three builds that differ by
  subtraction can only be judged simultaneously.

  ★ SO ALL THREE RUN AT ONCE, ON THE SAME ROUTE. Change the route and all three
  follow together — the comparison is never accidentally between two different
  pages. Nothing here navigates the top window; the builds are guests.

  ★ AND EACH IS RENDERED AT A REAL DESKTOP WIDTH AND SCALED DOWN, not squeezed
  into a third of the screen. A 1440px page shown in a 480px frame is a MOBILE
  layout — comparing three of those would be comparing three different designs
  and calling it a build diff. transform:scale on a fixed-width frame keeps the
  desktop layout and shrinks the picture.

  ★ THE READOUT IS THE POINT, NOT THE PICTURES. The three builds differ by what
  is CUT, and a cut thing is invisible by definition — you cannot see the absence
  of the dev nav in a thumbnail. So the strip under each pane probes for the
  things the public build removes and states them as present/absent.
  ═══════════════════════════════════════════════════════════════════════════
-->
<style>
  :root{--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:#08090b;color:#cfd8e4;font:12px/1.5 var(--mono);
       display:grid;grid-template-rows:auto 1fr;height:100vh;overflow:hidden}

  header{padding:12px 16px;border-bottom:1px solid #1b1d22;display:flex;gap:12px;
         align-items:center;flex-wrap:wrap}
  h1{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#8c96a4;margin:0}
  input[type=text]{background:#0e1013;border:1px solid #262a31;border-radius:2px;color:#dfe6ef;
                   font:12px var(--mono);padding:6px 9px;min-width:260px}
  button{background:#14161a;color:#9fa9b6;border:1px solid #262a31;border-radius:2px;
         font:11px var(--mono);padding:6px 9px;cursor:pointer}
  button:hover{color:#e6edf6;border-color:#3b424c}
  button[aria-pressed="true"]{background:#23303f;color:#dfeaf7;border-color:#3f5568}
  .hint{font-size:11px;color:#5f6773}

  main{display:grid;grid-template-columns:repeat(3,1fr);min-height:0}
  .bay{display:flex;flex-direction:column;min-width:0;min-height:0;border-left:1px solid #1b1d22}
  .bay:first-child{border-left:0}
  .bay__head{padding:9px 12px 8px;border-bottom:1px solid #1b1d22}
  .bay__key{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#dfe6ef}
  .bay__what{font-size:10.5px;color:#6d7684;margin-top:3px;line-height:1.45}
  .bay__view{flex:1;min-height:0;position:relative;overflow:hidden;background:#0a0b0d}
  /* the frame is a real desktop page; the wrapper scales the picture, not the layout */
  .bay__frame{position:absolute;top:0;left:0;border:0;transform-origin:0 0;background:#0a0b0d}
  .bay__probe{border-top:1px solid #1b1d22;padding:8px 12px 10px;font-size:10.5px;min-height:96px}
  .bay__probe div{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
  .bay__probe span:first-child{color:#6d7684}
  .yes{color:#8fae86}
  .no{color:#6d7684}
  .warn{color:#d59a6a}
</style>

<header>
  <h1>Cockpit</h1>
  <span class="hint">route</span>
  <input type="text" id="route" value="" placeholder="e.g.  ?dev=settings   or   codex.html">
  <button id="go">Point all three</button>
  <span class="hint">width</span>
  <button class="w" data-w="1440" aria-pressed="true">1440</button>
  <button class="w" data-w="1280" aria-pressed="false">1280</button>
  <button class="w" data-w="390"  aria-pressed="false">390</button>
  <button id="reload">Reload all</button>
  <span class="hint" id="stat">—</span>
</header>

<main id="bays"></main>

<script>
(function () {
  "use strict";

  /* the same three the pill knows about (app.js:1208), in the same order and with the
     same path segments — so this cannot drift from what the app itself considers a build */
  var BUILDS = [
    { key: "dev", seg: "",
      what: "The workshop at the site root. Everything: dev routes, the dev-nav rail, the build pill, work in progress." },
    { key: "preview", seg: "preview/",
      what: "The public build, WITH the build pill left in. The copy you show people." },
    { key: "live", seg: "live/",
      what: "The same public build with the pill cut out. The only one a launch would keep." }
  ];

  /* WHAT THE PUBLIC BUILD REMOVES. A cut thing is invisible in a thumbnail — that is
     what CUT means — so each probe asks the frame a direct question instead. Keep this
     list honest: if build_public.py starts stripping something else, add it here or the
     cockpit will quietly report a build it no longer describes. */
  var PROBES = [
    { k: "dev-nav rail",  f: function (d) { return !!d.getElementById("devnav"); } },
    { k: "build pill",    f: function (d) { return !!d.getElementById("brBuildFlip"); } },
    { k: "the card",      f: function (d) { return !!d.querySelector(".m2hero"); } },
    { k: "six marks",     f: function (d) { return d.querySelectorAll(".m2bface__marks li").length; } },
    { k: "specimen panel",f: function (d) { return !!d.querySelector(".sx"); } },
    { k: "roadmap box",   f: function (d) { return !!d.querySelector(".rmpop"); } }
  ];

  var W = 1440, bays = document.getElementById("bays");

  bays.innerHTML = BUILDS.map(function (b) {
    return '<div class="bay" data-key="' + b.key + '">'
      + '<div class="bay__head"><div class="bay__key">' + b.key + '</div>'
      + '<div class="bay__what">' + b.what + '</div></div>'
      + '<div class="bay__view"><iframe class="bay__frame" title="' + b.key + '"></iframe></div>'
      + '<div class="bay__probe"></div></div>';
  }).join("");

  function fit() {
    Array.prototype.forEach.call(document.querySelectorAll(".bay"), function (bay) {
      var view = bay.querySelector(".bay__view"), f = bay.querySelector(".bay__frame");
      var s = view.clientWidth / W;
      f.style.width = W + "px";
      f.style.height = Math.round(view.clientHeight / s) + "px";
      f.style.transform = "scale(" + s + ")";
    });
  }

  function load() {
    var route = document.getElementById("route").value.trim().replace(/^\/+/, "");
    Array.prototype.forEach.call(document.querySelectorAll(".bay"), function (bay, i) {
      var f = bay.querySelector(".bay__frame");
      /* cache-bust every load: this repo's version tokens are per-asset and a stale
         index.html here would show a build that is not the one on disk — the exact
         trap that cost several rounds earlier today. */
      /* ★★ THE PANES ARE THE REAL BUILDS, NOT PICTURES OF THEM — and `sx=1` is what
         makes that true. _six-live.js refuses to install inside a frame by default
         (BR-S479), which is correct for an embed it does not own but wrong here: a pane
         where the six marks are inert is a photograph of the build, not a copy of it.
         `sx=1` is this cockpit saying "these frames are mine".
         ★ AND NOTHING ELSE IS ADDED. No flags that alter layout, no dev overrides, no
         forced routes. The only two parameters are this opt-in and a cache-buster, so
         each pane is the build as it actually ships — which is the entire point of
         standing them side by side. A cockpit that quietly modifies what it displays is
         worse than no cockpit. */
      var sep = route.indexOf("?") > -1 ? "&" : "?";
      f.src = "/" + BUILDS[i].seg + route + sep + "sx=1&cockpit=" + Date.now();
    });
    document.getElementById("stat").textContent = "loading…";
    setTimeout(probe, 2600);
  }

  function probe() {
    var done = 0;
    Array.prototype.forEach.call(document.querySelectorAll(".bay"), function (bay) {
      var f = bay.querySelector(".bay__frame"), box = bay.querySelector(".bay__probe");
      var d = null;
      try { d = f.contentDocument; } catch (e) { }
      if (!d || !d.body) { box.innerHTML = '<div><span>frame</span><span class="warn">not readable</span></div>'; return; }
      done++;
      box.innerHTML = PROBES.map(function (p) {
        var v;
        try { v = p.f(d); } catch (e) { v = null; }
        var txt, cls;
        if (typeof v === "number") { txt = v || "absent"; cls = v ? "yes" : "no"; }
        else { txt = v ? "present" : "absent"; cls = v ? "yes" : "no"; }
        return '<div><span>' + p.k + '</span><span class="' + cls + '">' + txt + '</span></div>';
      }).join("");
    });
    document.getElementById("stat").textContent = done + "/3 read · probed " + new Date().toLocaleTimeString();
  }

  document.getElementById("go").addEventListener("click", load);
  document.getElementById("reload").addEventListener("click", load);
  document.getElementById("route").addEventListener("keydown", function (e) {
    if (e.key === "Enter") load();
  });
  Array.prototype.forEach.call(document.querySelectorAll("button.w"), function (b) {
    b.addEventListener("click", function () {
      W = +b.dataset.w;
      Array.prototype.forEach.call(document.querySelectorAll("button.w"), function (o) {
        o.setAttribute("aria-pressed", String(o === b));
      });
      fit();
    });
  });
  window.addEventListener("resize", fit);

  fit();
  load();
})();
</script>
</html>
